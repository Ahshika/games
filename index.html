<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AH//GAMES — Game Select</title>
<meta name="description" content="The games of Ahmed Hassan: pick a title, read the briefing, download and play.">
<meta name="theme-color" content="#04050a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04050a; --ink:#eaf2ff; --dim:#8c97b3; --faint:#4b5470; --hud:#3ef0ff; --hud2:#ff3e9a; --ok:#b6ff3e;
    --hue:265; --acc:hsl(var(--hue) 100% 64%); --acc-soft:hsl(var(--hue) 100% 64% / .16); --acc-line:hsl(var(--hue) 100% 64% / .5);
    --display:'Orbitron',system-ui,sans-serif; --ui:'Rajdhani',system-ui,'Segoe UI',sans-serif;
    --cut:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{background:var(--bg); color:var(--ink); font:500 17px/1.45 var(--ui); overflow-x:hidden; -webkit-font-smoothing:antialiased; transition:--hue .6s}
  a{color:inherit}
  button{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--hud); outline-offset:3px}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  /* angled "cut corner" panels: the HUD language of the whole page */
  .cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}

  #field{position:fixed; inset:0; z-index:0; width:100%; height:100%; display:block}
  .vignette{position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(120% 90% at 50% 40%,transparent 40%,#04050acc 100%)}
  .scan{position:fixed; inset:0; z-index:2; pointer-events:none; background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px); mix-blend-mode:overlay}

  /* ---------- boot ---------- */
  #boot{position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:#04050af2; text-align:center; cursor:pointer}
  #boot[hidden]{display:none}
  .boot-logo{font:900 clamp(44px,9vw,120px)/1 var(--display); letter-spacing:.04em; position:relative; color:var(--ink)}
  .boot-logo b{color:var(--hud)}
  .boot-logo::before,.boot-logo::after{content:attr(data-text); position:absolute; inset:0; opacity:.75}
  .boot-logo::before{color:var(--hud2); transform:translate(-3px,0); clip-path:inset(0 0 55% 0); animation:glitch 2.4s infinite steps(2)}
  .boot-logo::after{color:var(--hud); transform:translate(3px,0); clip-path:inset(55% 0 0 0); animation:glitch 2.1s infinite reverse steps(2)}
  @keyframes glitch{0%,86%{transform:translate(0)} 88%{transform:translate(-6px,2px)} 92%{transform:translate(5px,-2px)} 96%{transform:translate(-2px,1px)} 100%{transform:translate(0)}}
  .boot-sub{font:600 15px var(--ui); letter-spacing:.42em; text-transform:uppercase; color:var(--dim); margin:18px 0 44px}
  .press{font:800 clamp(16px,2.2vw,22px) var(--display); letter-spacing:.3em; color:var(--ok); background:none; border:0; cursor:pointer; animation:blink 1.1s infinite steps(1)}
  @keyframes blink{50%{opacity:.15}}
  .boot-hint{margin-top:16px; font-size:13px; letter-spacing:.2em; color:var(--faint); text-transform:uppercase}

  /* ---------- HUD ---------- */
  .hud{position:relative; z-index:10; display:flex; align-items:center; gap:18px; padding:16px clamp(16px,3vw,36px); text-transform:uppercase; letter-spacing:.12em}
  .p1{display:flex; align-items:center; gap:12px}
  .avatar{width:42px; height:42px; display:grid; place-items:center; font:900 15px var(--display); color:#04050a; background:linear-gradient(135deg,var(--hud),var(--acc)); --cut:8px}
  .p1 small{display:block; font-size:12px; color:var(--hud); letter-spacing:.24em}
  .p1 strong{font:700 16px var(--ui); letter-spacing:.14em}
  .mode{margin:0 auto; font:800 14px var(--display); letter-spacing:.4em; color:var(--dim)}
  .mode span{color:var(--ink)}
  .hud-r{display:flex; align-items:center; gap:10px}
  .counter{font:800 13px var(--display); color:var(--dim)}
  .counter b{color:var(--ok); font-size:18px}
  .hbtn{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 12px; background:#ffffff0a; border:1px solid #ffffff1f; font:700 13px var(--ui); letter-spacing:.14em; text-decoration:none; cursor:pointer; --cut:7px}
  .hbtn:hover{background:var(--acc-soft); border-color:var(--acc-line)}
  .hbtn svg{width:16px; height:16px}

  /* ---------- stage ---------- */
  main{position:relative; z-index:5; min-height:calc(100vh - 74px); display:flex; flex-direction:column}
  .stage{flex:1; display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); gap:clamp(24px,4vw,64px); align-items:center; padding:12px clamp(16px,5vw,72px) 24px}

  /* the game case */
  .case-wrap{perspective:1200px; display:grid; place-items:center}
  .case{position:relative; width:min(100%,430px); aspect-ratio:3/4; transform-style:preserve-3d; transition:transform .25s ease-out}
  .case-inner{position:absolute; inset:0; overflow:hidden; background:#0b0d18; border:1px solid var(--acc-line); box-shadow:0 30px 80px -30px var(--acc),0 0 0 1px #ffffff0d inset; --cut:22px}
  .case-inner svg,.case-inner img{width:100%; height:100%; object-fit:cover; display:block}
  .case-sheen{position:absolute; inset:0; pointer-events:none; background:linear-gradient(115deg,transparent 30%,#ffffff2e 45%,hsl(calc(var(--hue) + 60) 100% 70% / .18) 52%,transparent 66%); background-size:250% 100%; mix-blend-mode:screen; transition:background-position .2s}
  .case-tag{position:absolute; left:18px; top:18px; padding:5px 10px; font:800 11px var(--display); letter-spacing:.24em; color:#04050a; background:var(--ok); --cut:6px}
  .case-plate{position:absolute; left:0; right:0; bottom:0; padding:60px 22px 20px; background:linear-gradient(transparent,#04050af0)}
  .case-plate .t{font:900 clamp(24px,3vw,34px)/1 var(--display); text-transform:uppercase; letter-spacing:.04em}
  .case-plate .s{font:600 13px var(--ui); letter-spacing:.3em; color:var(--acc); text-transform:uppercase; margin-top:8px}
  .case-shadow{position:absolute; left:10%; right:10%; bottom:-34px; height:30px; background:radial-gradient(closest-side,var(--acc-soft),transparent); filter:blur(6px)}

  /* briefing */
  .brief{min-width:0}
  .eyebrow{display:flex; align-items:center; gap:10px; font:700 13px var(--ui); letter-spacing:.32em; text-transform:uppercase; color:var(--hud)}
  .eyebrow i{width:36px; height:2px; background:currentColor}
  .brief h1{font:900 clamp(40px,6.4vw,92px)/.92 var(--display); text-transform:uppercase; letter-spacing:.01em; margin:12px 0 14px; text-wrap:balance; text-shadow:0 0 40px var(--acc-soft)}
  .tagline{font-size:clamp(18px,1.7vw,22px); color:#cdd6ec; max-width:56ch; margin:0 0 18px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px}
  .chip{display:inline-flex; align-items:center; gap:7px; padding:5px 12px; font:700 13px var(--ui); letter-spacing:.16em; text-transform:uppercase; background:#ffffff08; border:1px solid #ffffff1c; --cut:7px}
  .chip svg{width:15px; height:15px}
  .chip.genre{color:#04050a; background:var(--acc); border-color:transparent}
  .chip.build{color:var(--ok); border-color:#b6ff3e55}

  .panels{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:14px; margin-bottom:22px}
  .panel{background:#0a0d18cc; border:1px solid #ffffff14; padding:14px 16px 16px; --cut:12px; backdrop-filter:blur(6px)}
  .panel h2{margin:0 0 10px; font:800 12px var(--display); letter-spacing:.32em; color:var(--dim); display:flex; justify-content:space-between}
  .panel h2 span{color:var(--acc)}
  .quests{list-style:none; margin:0; padding:0; display:grid; gap:10px}
  .quests li{display:grid; grid-template-columns:22px minmax(0,1fr); gap:10px; font-size:16px; color:#d5dcef; line-height:1.4}
  .quests li::before{content:''; width:14px; height:14px; margin-top:4px; border:2px solid var(--ok); transform:rotate(45deg); box-shadow:0 0 10px #b6ff3e66}
  .loadout{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px}
  .slot{aspect-ratio:1; display:grid; place-items:center; align-content:center; gap:4px; background:#ffffff06; border:1px solid #ffffff1a; text-align:center; padding:6px; --cut:8px}
  .slot b{font:900 17px var(--display); color:var(--acc)}
  .slot small{font:600 11px var(--ui); letter-spacing:.06em; color:var(--dim); line-height:1.1; overflow-wrap:anywhere}
  .stats{display:flex; flex-wrap:wrap; gap:18px; margin-top:12px; font:600 13px var(--ui); letter-spacing:.16em; text-transform:uppercase; color:var(--dim)}
  .stats b{color:var(--ink); letter-spacing:.06em}

  .actions{display:flex; flex-wrap:wrap; gap:12px}
  .act{display:inline-flex; align-items:center; gap:12px; padding:12px 22px 12px 14px; font:700 16px var(--ui); letter-spacing:.16em; text-transform:uppercase; text-decoration:none; background:#ffffff0c; border:1px solid #ffffff26; cursor:pointer; transition:transform .12s,background .12s; --cut:10px}
  .act:hover{transform:translateY(-2px); background:#ffffff16}
  .act.primary{background:var(--acc); color:#04050a; border-color:transparent; box-shadow:0 12px 34px -10px var(--acc)}
  .act.primary:hover{filter:brightness(1.1)}
  .glyph{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font:800 13px var(--display); border:2px solid currentColor; flex:none}

  /* select strip */
  .select{position:relative; z-index:6; padding:0 clamp(16px,5vw,72px) 14px}
  .select-head{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; margin-bottom:10px; font:800 12px var(--display); letter-spacing:.32em; color:var(--dim)}
  .modes{display:flex; flex-wrap:wrap; gap:6px; margin-inline-start:auto}
  .mode-btn{padding:4px 10px; font:700 12px var(--ui); letter-spacing:.16em; text-transform:uppercase; background:transparent; border:1px solid #ffffff1c; cursor:pointer; color:var(--dim); --cut:6px}
  .mode-btn[aria-pressed="true"]{color:#04050a; background:var(--hud); border-color:transparent}
  .strip{display:flex; gap:14px; overflow-x:auto; padding:6px 2px 10px; scroll-snap-type:x mandatory; scrollbar-width:thin}
  .cart{flex:0 0 auto; width:190px; scroll-snap-align:start; text-align:start; padding:0; background:#0a0d18; border:1px solid #ffffff1a; cursor:pointer; transition:transform .15s,border-color .15s; --cut:10px}
  .cart:hover{transform:translateY(-3px)}
  .cart[aria-current="true"]{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset,0 10px 30px -12px var(--acc)}
  .cart .thumb{aspect-ratio:16/9; overflow:hidden}
  .cart .thumb svg,.cart .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .cart .ct{padding:8px 10px 10px; font:800 13px var(--display); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cart .cs{display:block; font:600 11px var(--ui); letter-spacing:.2em; color:var(--dim); margin-top:2px}

  .controls{position:relative; z-index:6; display:flex; flex-wrap:wrap; gap:8px 22px; justify-content:center; padding:10px 16px 18px; font:600 13px var(--ui); letter-spacing:.18em; text-transform:uppercase; color:var(--faint)}
  kbd{display:inline-grid; place-items:center; min-width:24px; height:24px; padding:0 6px; margin-inline-end:6px; font:700 12px var(--display); color:var(--dim); border:1px solid #ffffff2a; border-bottom-width:3px; border-radius:5px}
  footer{position:relative; z-index:6; text-align:center; padding:6px 16px 22px; font-size:13px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase}
  footer a{color:var(--dim)}
  .msg{padding:60px 0; color:var(--dim); letter-spacing:.1em}

  @media (max-width:900px){
    .stage{grid-template-columns:minmax(0,1fr)}
    .case{width:min(78vw,330px)}
    .panels{grid-template-columns:minmax(0,1fr)}
    .mode{display:none}
    .controls .kb{display:none}
  }
  @media (max-width:520px){
    body{font-size:16px}
    .hud{gap:10px; padding:12px 14px}
    .p1 small{display:none}
    .hbtn .lbl{display:none}
    .counter{display:none}
    .cart{width:150px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important; transition:none!important}
    .case{transform:none!important}
  }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>

<div id="boot" role="dialog" aria-modal="true" aria-label="Start screen">
  <div>
    <div class="boot-logo" data-text="AH//GAMES">AH<b>//</b>GAMES</div>
    <div class="boot-sub">Games by Ahmed Hassan</div>
    <button class="press" id="press" type="button">PRESS START</button>
    <div class="boot-hint">Any key · click · Ⓐ on a gamepad</div>
  </div>
</div>

<header class="hud">
  <div class="p1">
    <div class="avatar cut" aria-hidden="true">AH</div>
    <div><small>Player 1</small><strong>Ahmed Hassan</strong></div>
  </div>
  <div class="mode" aria-hidden="true">— Game <span>Select</span> —</div>
  <div class="hud-r">
    <span class="counter">Titles <b id="count">00</b></span>
    <button class="hbtn cut" id="sound" type="button" aria-pressed="false" title="Sound effects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path id="wave" d="M16 9a4 4 0 0 1 0 6" opacity=".3"/></svg><span class="lbl">Sound</span>
    </button>
    <a class="hbtn cut" href="https://ahshika.github.io/"><span class="lbl">Software</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
    <a class="hbtn cut" href="https://github.com/Ahshika" target="_blank" rel="noopener"><span class="lbl">GitHub</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
  </div>
</header>

<main id="main">
  <section class="stage" id="stage" aria-live="polite" aria-label="Selected game">
    <p class="msg">Loading…</p>
  </section>

  <section class="select" aria-labelledby="sel-h">
    <div class="select-head"><span id="sel-h">Select a game</span><div class="modes" id="modes"></div></div>
    <div class="strip" id="strip" role="list"></div>
  </section>

  <div class="controls" aria-hidden="true">
    <span class="kb"><kbd>←</kbd><kbd>→</kbd>Select</span>
    <span class="kb"><kbd>Enter</kbd>Download</span>
    <span class="kb"><kbd>S</kbd>Source</span>
    <span>Gamepad: <kbd>LB</kbd><kbd>RB</kbd>Select · <kbd>A</kbd>Download · <kbd>Y</kbd>Source</span>
  </div>
</main>

<footer>&copy; <span id="year"></span> Ahmed Hassan · <a href="https://ahshika.github.io/">Software portfolio</a></footer>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https:\/\//i.test(u || '') ? u : '';
const safeAsset = u => /^assets\/[a-z0-9._-]+\.(png|jpe?g|webp|avif)$/i.test(u || '') ? u : '';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} } };
$('#year').textContent = new Date().getFullYear();

const PLATFORM = {WINDOWS:'Windows', MACOS:'macOS', LINUX:'Linux', ANDROID:'Android', IOS:'iOS', WEB:'Web', CONSOLE:'Console'};
const PICON = {
  WINDOWS:'<path d="M3 5l8-1v8H3zM13 4l8-1v9h-8zM3 13h8v8l-8-1zM13 13h8v9l-8-1z"/>',
  ANDROID:'<path d="M6 10h12v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM7 9a5 5 0 0 1 10 0M9 6 7.5 3.5M15 6l1.5-2.5"/>',
  IOS:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  MACOS:'<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/>',
  LINUX:'<path d="m5 8 4 4-4 4M11 16h8"/>',
  WEB:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  CONSOLE:'<path d="M6 8h12a4 4 0 0 1 3.9 5l-1 4a3 3 0 0 1-5.4 1L14 16h-4l-1.5 2a3 3 0 0 1-5.4-1l-1-4A4 4 0 0 1 6 8zM8 11v3M6.5 12.5h3"/>',
};
const picon = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PICON[p] || PICON.CONSOLE}</svg>`;

/* deterministic per-game identity: hue + generated key art (abstract, never a fake screenshot) */
function hash(s){ let h = 2166136261; for(const ch of s){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let x = seed || 1; return () => (x = Math.imul(x ^ (x >>> 15), 2246822519) ^ Math.imul(x ^ (x >>> 13), 3266489917), ((x ^= x >>> 16) >>> 0) / 4294967296); }
const hueOf = g => hash(g.id + g.name) % 360;
function keyArt(g, w, h){
  const r = rng(hash(g.name + g.genre)), hue = hueOf(g), id = 'k' + hash(g.id + w).toString(36);
  let rings = '', shards = '';
  const cx = w * (0.35 + r() * 0.3), cy = h * (0.3 + r() * 0.25);
  for(let i = 0; i < 6; i++) rings += `<circle cx="${cx}" cy="${cy}" r="${(40 + i * 46).toFixed(0)}" fill="none" stroke="hsl(${hue} 100% 70%)" stroke-opacity="${(0.32 - i * 0.045).toFixed(2)}" stroke-width="${i % 2 ? 1 : 2}" stroke-dasharray="${i % 2 ? '4 10' : 'none'}"/>`;
  for(let i = 0; i < 18; i++){
    const x = r() * w, y = r() * h, s = 10 + r() * 70, a = r() * 360;
    shards += `<polygon points="0,${-s} ${s*0.6},${s*0.5} ${-s*0.6},${s*0.5}" transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${a.toFixed(0)})" fill="hsl(${(hue + i * 21) % 360} 100% ${55 + r()*20}%)" opacity="${(0.08 + r()*0.3).toFixed(2)}"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(g.name)} key art">
    <defs><radialGradient id="${id}" cx="${(cx/w).toFixed(2)}" cy="${(cy/h).toFixed(2)}" r="0.9"><stop offset="0" stop-color="hsl(${hue} 90% 32%)"/><stop offset=".55" stop-color="hsl(${(hue+40)%360} 80% 12%)"/><stop offset="1" stop-color="#05060c"/></radialGradient>
    <pattern id="${id}h" width="22" height="38" patternUnits="userSpaceOnUse"><path d="M11 0 22 6.3v12.7L11 25.4 0 19V6.3z" fill="none" stroke="#ffffff0c"/></pattern></defs>
    <rect width="${w}" height="${h}" fill="url(#${id})"/><rect width="${w}" height="${h}" fill="url(#${id}h)"/>${rings}${shards}
    <circle cx="${cx}" cy="${cy}" r="26" fill="hsl(${hue} 100% 75%)" opacity=".9"/><circle cx="${cx}" cy="${cy}" r="60" fill="hsl(${hue} 100% 70%)" opacity=".18"/></svg>`;
}
const art = (g, w, h) => safeAsset(g.cover) ? `<img src="${esc(g.cover)}" alt="${esc(g.name)} cover art">` : keyArt(g, w, h);
const abbr = t => { const w = String(t).replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/); return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase(); };

/* ---------- sound (synthesized, off by default) ---------- */
let audio = null, soundOn = store.get('ah-games-sound') === 'on';
function blip(freq = 660, dur = 0.07, type = 'square'){
  if(!soundOn) return;
  try {
    audio ??= new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = 0.04;
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
  } catch {}
}
function syncSound(){ $('#sound').setAttribute('aria-pressed', String(soundOn)); $('#wave').setAttribute('opacity', soundOn ? '1' : '.3'); }
$('#sound').addEventListener('click', () => { soundOn = !soundOn; store.set('ah-games-sound', soundOn ? 'on' : 'off'); syncSound(); blip(880, .09); });
syncSound();

/* ---------- boot screen ---------- */
const boot = $('#boot');
function start(){ if(boot.hidden) return; boot.hidden = true; try { sessionStorage.setItem('ah-games-booted', '1'); } catch {} blip(520, .06); setTimeout(() => blip(880, .1), 70); $('#strip [aria-current="true"]')?.focus({preventScroll:true}); }
let booted = false; try { booted = sessionStorage.getItem('ah-games-booted') === '1'; } catch {}
if(booted) boot.hidden = true; else $('#press').focus();
boot.addEventListener('click', start);
addEventListener('keydown', e => { if(!boot.hidden && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); start(); } }, true);

/* ---------- data + rendering ---------- */
let GAMES = [], view = [], sel = 0;
const mode = {genre: ''};

function chips(g){
  return `<span class="chip genre cut">${esc(g.genre)}</span>` +
    g.platforms.map(p => `<span class="chip cut">${picon(p)}${esc(PLATFORM[p] || p)}</span>`).join('') +
    `<span class="chip build cut">${esc(g.status)}${g.version ? ' · ' + esc(g.version) : ''}</span>`;
}
function actions(g){
  const dls = (g.downloads || []).filter(d => safeUrl(d.url));
  return [
    ...dls.map((d, i) => `<a class="act cut${i === 0 ? ' primary' : ''}" href="${esc(d.url)}" rel="noopener" ${i === 0 ? 'data-key="a"' : ''}><span class="glyph">A</span>Download ${esc(d.label)}</a>`),
    safeUrl(g.live) ? `<a class="act cut${dls.length ? '' : ' primary'}" href="${esc(g.live)}" target="_blank" rel="noopener" ${dls.length ? '' : 'data-key="a"'}><span class="glyph">▶</span>Play now</a>` : '',
    safeUrl(g.repo) ? `<a class="act cut" href="${esc(g.repo)}" target="_blank" rel="noopener" data-key="y"><span class="glyph">Y</span>Source code</a>` : '',
  ].join('');
}

function renderStage(){
  const g = view[sel];
  const stage = $('#stage');
  if(!g){ stage.innerHTML = `<p class="msg">${GAMES.length ? 'No game in this mode.' : 'No games yet. The first one is on its way.'}</p>`; return; }
  document.documentElement.style.setProperty('--hue', hueOf(g));
  const facts = [['Build', g.version], ['Released', g.releaseDate], ['Engine', g.engine]].filter(([, v]) => v);
  stage.innerHTML = `
    <div class="case-wrap">
      <div class="case" id="case">
        <div class="case-inner cut">${art(g, 600, 800)}<div class="case-sheen" id="sheen"></div>
          ${g.featured ? '<span class="case-tag">Featured</span>' : ''}
          <div class="case-plate"><div class="t">${esc(g.name)}</div><div class="s">${esc(g.genre)}</div></div>
        </div>
        <div class="case-shadow"></div>
      </div>
    </div>
    <div class="brief">
      <div class="eyebrow"><i></i>${g.status === 'Released' ? 'Now playing' : esc(g.status)}</div>
      <h1>${esc(g.name)}</h1>
      <p class="tagline">${esc(g.tagline)}</p>
      <div class="chips">${chips(g)}</div>
      <div class="panels">
        <div class="panel cut"><h2>Quest log <span>${String(g.points.length).padStart(2, '0')}</span></h2>
          ${g.points.length ? `<ul class="quests">${g.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : `<p style="margin:0;color:var(--dim)">${esc(g.tagline)}</p>`}</div>
        <div class="panel cut"><h2>Loadout <span>${String(g.tech.length).padStart(2, '0')}</span></h2>
          <div class="loadout">${g.tech.map(t => `<div class="slot cut" title="${esc(t)}"><b>${esc(abbr(t))}</b><small>${esc(t)}</small></div>`).join('')}</div>
          ${facts.length ? `<div class="stats">${facts.map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join('')}</div>` : ''}</div>
      </div>
      <div class="actions">${actions(g)}</div>
    </div>`;
  tilt();
}

function renderStrip(){
  $('#count').textContent = String(GAMES.length).padStart(2, '0');
  $('#strip').innerHTML = view.map((g, i) => `
    <button class="cart cut" type="button" role="listitem" data-i="${i}" aria-current="${i === sel}" aria-label="${esc(g.name)}, ${esc(g.genre)}">
      <div class="thumb">${art(g, 320, 180)}</div><div class="ct">${esc(g.name)}<span class="cs">${esc(g.genre)}</span></div>
    </button>`).join('');
  const genres = [...new Set(GAMES.map(g => g.genre))].sort();
  $('#modes').innerHTML = genres.length < 2 ? '' : [['', 'All'], ...genres.map(x => [x, x])]
    .map(([v, n]) => `<button class="mode-btn cut" type="button" data-mode="${esc(v)}" aria-pressed="${mode.genre === v}">${esc(n)}</button>`).join('');
}

function select(i, focus = false){
  if(!view.length) return;
  sel = (i + view.length) % view.length;
  renderStage();
  document.querySelectorAll('.cart').forEach(c => c.setAttribute('aria-current', String(Number(c.dataset.i) === sel)));
  const cur = document.querySelector(`.cart[data-i="${sel}"]`);
  cur?.scrollIntoView({block:'nearest', inline:'nearest', behavior: reduced ? 'auto' : 'smooth'});
  if(focus) cur?.focus({preventScroll:true});
  blip(440 + sel * 40, .05);
}

function applyMode(){ view = GAMES.filter(g => !mode.genre || g.genre === mode.genre); sel = 0; renderStrip(); renderStage(); }

document.addEventListener('click', e => {
  const c = e.target.closest('.cart'); if(c){ select(Number(c.dataset.i)); return; }
  const m = e.target.closest('.mode-btn'); if(m){ mode.genre = m.dataset.mode; applyMode(); blip(700, .05); }
});
const inEl = (e, sel) => e.target instanceof Element && !!e.target.closest(sel);
addEventListener('keydown', e => {
  if(!boot.hidden || e.ctrlKey || e.metaKey || e.altKey || inEl(e, 'input,textarea')) return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); select(sel + 1, true); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); select(sel - 1, true); }
  else if(e.key === 'Enter' && inEl(e, '.cart')){ e.preventDefault(); $('#stage [data-key="a"]')?.click(); }
  else if(e.key.toLowerCase() === 's' && !inEl(e, 'a,button')){ $('#stage [data-key="y"]')?.click(); }
});

/* case tilt + holographic sheen follow the pointer */
function tilt(){
  const c = $('#case'), sheen = $('#sheen');
  if(!c || reduced) return;
  const wrap = c.parentElement;
  wrap.onpointermove = e => {
    const r = wrap.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    c.style.transform = `rotateY(${(x * 18).toFixed(1)}deg) rotateX(${(-y * 14).toFixed(1)}deg)`;
    sheen.style.backgroundPosition = `${(x * 100 + 50).toFixed(0)}% 0`;
  };
  wrap.onpointerleave = () => { c.style.transform = ''; sheen.style.backgroundPosition = ''; };
}

/* gamepad: LB/RB or d-pad to select, A to download, Y for source, Start to begin */
const pads = {prev: {}};
function pollPad(){
  const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
  if(gp){
    const down = i => gp.buttons[i]?.pressed, edge = i => down(i) && !pads.prev[i];
    if(!boot.hidden && (edge(0) || edge(9))) start();
    else {
      if(edge(5) || edge(15)) select(sel + 1, true);
      if(edge(4) || edge(14)) select(sel - 1, true);
      if(edge(0)) $('#stage [data-key="a"]')?.click();
      if(edge(3)) $('#stage [data-key="y"]')?.click();
    }
    gp.buttons.forEach((b, i) => pads.prev[i] = b.pressed);
    requestAnimationFrame(pollPad);
  } else pads.running = false;
}
addEventListener('gamepadconnected', () => { if(!pads.running){ pads.running = true; requestAnimationFrame(pollPad); } });

/* background: a field of points that light up in the selected game's colour near the pointer */
(function field(){
  const cv = $('#field'), ctx = cv.getContext('2d');
  let w, h, pts = [], mx = -999, my = -999, t = 0;
  function size(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    const gap = 34 * dpr; pts = [];
    for(let y = gap / 2; y < h; y += gap) for(let x = (y / gap % 2 ? gap / 2 : 0); x < w; x += gap) pts.push([x, y, Math.random() * 6.28]);
    draw();
  }
  function draw(){
    ctx.clearRect(0, 0, w, h);
    const hue = getComputedStyle(document.documentElement).getPropertyValue('--hue') || 265, dpr = Math.min(devicePixelRatio || 1, 2), R = 170 * dpr;
    for(const [x, y, ph] of pts){
      const d = Math.hypot(x - mx, y - my), near = Math.max(0, 1 - d / R);
      const tw = reduced ? 0.5 : 0.5 + 0.5 * Math.sin(t / 900 + ph);
      ctx.fillStyle = near > 0 ? `hsla(${hue},100%,70%,${(0.12 + near * 0.8).toFixed(3)})` : `rgba(140,151,179,${(0.05 + tw * 0.07).toFixed(3)})`;
      const s = (1 + near * 2.2) * dpr;
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
    }
  }
  function loop(ts){ t = ts; draw(); if(!document.hidden) requestAnimationFrame(loop); }
  addEventListener('resize', size);
  addEventListener('pointermove', e => { const dpr = Math.min(devicePixelRatio || 1, 2); mx = e.clientX * dpr; my = e.clientY * dpr; if(reduced) draw(); });
  document.addEventListener('visibilitychange', () => { if(!document.hidden && !reduced) requestAnimationFrame(loop); });
  size();
  if(!reduced) requestAnimationFrame(loop);
})();

async function load(){
  try {
    const r = await fetch('data/games.json', {cache: 'no-cache'});
    if(!r.ok) throw new Error(String(r.status));
    const data = await r.json();
    // Defence in depth: games only. Software lives at ahshika.github.io.
    GAMES = (Array.isArray(data.games) ? data.games : []).filter(g => g && g.family === 'GAME')
      .sort((a, b) => Number(!!b.featured) - Number(!!a.featured) || String(b.releaseDate || '').localeCompare(String(a.releaseDate || '')));
  } catch {
    $('#stage').innerHTML = '<p class="msg">Could not load the games. Please reload the page.</p>';
    return;
  }
  applyMode();
}
load();
</script>
